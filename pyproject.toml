[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["gpu_lab"]

[tool.coverage.report]
show_missing = true

[tool.pyright]
include = ["gpu_lab"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
